<!DOCTYPE html>
<html lang="pt-br">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Perfil - FreelaFree</title>
 <meta name="description" content="Perfil público, reputação e histórico de trabalhos na FreelaFree.">
 <meta name="theme-color" content="#2563eb">
 <link rel="icon" type="image/svg+xml" href="favicon.svg">
 <meta property="og:type" content="profile">
 <meta property="og:site_name" content="FreelaFree">
 <meta property="og:title" content="Perfil — FreelaFree">
 <meta property="og:locale" content="pt_BR">
 <link rel="stylesheet" href="style.css">
 <style>
  .skip-link{position:absolute;left:-9999px;top:0;background:#2563eb;color:#fff;padding:10px 16px;z-index:1000;border-radius:0 0 8px 0;text-decoration:none;font-weight:600;}
  .skip-link:focus{left:0;}
  a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #2563eb;outline-offset:2px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .pf-wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px;}

  .pf-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:18px;}

  .pf-topo{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .pf-avatar{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
             font-size:28px;font-weight:700;color:#fff;background:#2563eb;flex-shrink:0;overflow:hidden;}
  .pf-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .pf-avatar-wrap{position:relative;flex-shrink:0;}
  .pf-avatar-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
  .pf-remover-foto{background:none;border:none;color:#dc2626;font-size:12px;font-weight:600;cursor:pointer;padding:2px;}
  .pf-remover-foto:hover{text-decoration:underline;}
  .pf-remover-foto:disabled{color:#94a3b8;cursor:not-allowed;text-decoration:none;}
  .pf-avatar-clicavel{cursor:pointer;display:inline-block;}
  .pf-avatar-overlay{position:absolute;inset:0;border-radius:50%;
    background:rgba(15,23,42,.55);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;opacity:0;transition:opacity .15s ease;pointer-events:none;}
  .pf-avatar-clicavel:hover .pf-avatar-overlay,
  .pf-avatar-clicavel:focus-visible .pf-avatar-overlay{opacity:1;}
  .pf-ident{flex:1;min-width:200px;}
  .pf-nome{font-size:24px;font-weight:700;color:#0f172a;margin:0 0 4px;}
  .pf-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .pf-tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;}
  .tag-freela{background:#dbeafe;color:#1d4ed8;}
  .tag-contrat{background:#dcfce7;color:#15803d;}
  .tag-admin{background:#fef3c7;color:#a16207;}
  .pf-desde{font-size:13px;color:#94a3b8;}

  .pf-rep{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .pf-estrelas{color:#f59e0b;font-size:20px;letter-spacing:2px;}
  .pf-nota{font-size:20px;font-weight:700;color:#0f172a;}
  .pf-qtd{font-size:13px;color:#64748b;}
  .pf-semrep{font-size:13px;color:#94a3b8;font-style:italic;margin-top:6px;}

  .pf-bio{margin-top:16px;padding-top:16px;border-top:1px solid #f1f5f9;
          font-size:15px;color:#334155;line-height:1.6;}

  .pf-hab{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;}
  .pf-hab span{background:#f1f5f9;color:#334155;font-size:13px;padding:5px 12px;border-radius:999px;}

  .pf-secao-titulo{font-size:13px;font-weight:700;text-transform:uppercase;color:#64748b;
                   letter-spacing:.6px;margin:0 0 14px;}

  .pf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .pf-stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center;}
  .pf-stat-num{font-size:22px;font-weight:700;color:#1e293b;}
  .pf-stat-lbl{font-size:12px;color:#64748b;margin-top:3px;}
  .pf-stat.destaque .pf-stat-num{color:#059669;}

  .aval-item{border:1px solid #eef0f3;border-radius:12px;padding:14px;margin-bottom:10px;background:#fafbfc;}
  .aval-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .aval-autor{font-weight:600;color:#1e293b;font-size:14px;}
  .aval-est{color:#f59e0b;letter-spacing:1px;font-size:14px;}
  .aval-proj{font-size:12px;color:#94a3b8;margin-top:2px;}
  .aval-coment{font-size:14px;color:#374151;margin-top:8px;font-style:italic;
               border-left:3px solid #e2e8f0;padding-left:10px;}
  .aval-data{font-size:12px;color:#94a3b8;}

  .vazio{color:#94a3b8;font-size:14px;padding:10px 0;}
  .pf-voltar{display:inline-block;margin-bottom:16px;color:#2563eb;text-decoration:none;font-size:14px;font-weight:600;}
  .pf-voltar:hover{text-decoration:underline;}

  /* Edição do próprio perfil */
  .pf-btn-editar{background:#2563eb;color:#fff;border:none;padding:9px 18px;border-radius:8px;
                 font-weight:600;font-size:14px;cursor:pointer;}
  .pf-btn-editar:hover{background:#1d4ed8;}
  .pf-edit{margin-top:18px;padding-top:18px;border-top:1px solid #f1f5f9;}
  .pf-campo{margin-bottom:14px;}
  .pf-campo label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px;}
  .pf-campo input,.pf-campo textarea{
    width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;
    font-size:14px;font-family:inherit;box-sizing:border-box;}
  .pf-campo input:focus,.pf-campo textarea:focus{outline:none;border-color:#2563eb;}
  .pf-campo .hint{font-size:12px;color:#94a3b8;margin-top:4px;display:block;}
  .pf-edit-btns{display:flex;gap:10px;margin-top:6px;}
  .pf-salvar{flex:1;background:#059669;color:#fff;border:none;padding:11px;border-radius:8px;
             font-weight:600;font-size:14px;cursor:pointer;}
  .pf-salvar:hover{background:#047857;}
  .pf-salvar:disabled{background:#94a3b8;cursor:not-allowed;}
  .pf-cancelar{flex:1;background:#f1f5f9;color:#475569;border:none;padding:11px;border-radius:8px;
               font-weight:600;font-size:14px;cursor:pointer;}
  .pf-cancelar:hover{background:#e2e8f0;}
  .pf-msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px;display:none;}
  .pf-msg.ok{background:#dcfce7;color:#166534;border:1px solid #86efac;display:block;}
  .pf-msg.erro{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;display:block;}
 </style>
</head>
<body>

<a href="#conteudo" class="skip-link">Pular para o conteúdo</a>

<header>
 <h1>FreelaFree</h1>
 <p>Reputação construída com trabalho entregue.</p>
</header>

<nav>
 <div class="nav-left"></div>
 <button class="nav-hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="nav-links-pf">&#9776;</button>
 <div class="nav-links" id="nav-links-pf">
  <a href="index.html">Início</a>
  <a href="index.html#sobre">Sobre</a>
  <a href="index.html#servicos">Serviços</a>
  <a href="index.html#beneficios">Benefícios</a>
  <a href="index.html#footer">Contato</a>
  <a href="termos.html">Termos de uso</a>
  <a href="privacidade.html">Privacidade</a>
  <a href="mensagens.html">Mensagens</a>
 </div>
 <div class="nav-right">
  <div class="search-bar">
   <label for="buscaNav" class="sr-only">Buscar no site</label>
   <input type="text" id="buscaNav" placeholder="Buscar...">
   <button class="search-btn" aria-label="Buscar"></button>
  </div>
  <div id="userArea"></div>
 </div>
</nav>

<main class="pf-wrap" id="conteudo">
 <a href="javascript:history.back()" class="pf-voltar">← Voltar</a>
 <div id="conteudoPerfil">
  <div class="vazio">Carregando perfil...</div>
 </div>
</main>

<footer id="footer">
 <div class="footer-contato">
  <p>Freelafree3@gmail.com</p>
  <a href="https://www.instagram.com/_freelafree" target="_blank" style="text-decoration:none;display:inline-block;">
   <img src="instagram.svg" alt="Instagram" style="width:36px;height:36px;border-radius:8px;display:block;">
  </a>
 </div>
 <p>© 2026 FreelaFree</p>
</footer>

<script src="api.js"></script>
<script src="ui.js"></script>
<script>
document.getElementById('hamburger')?.addEventListener('click', function () {
 const exp = this.getAttribute('aria-expanded') === 'true';
 this.setAttribute('aria-expanded', String(!exp));
});

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function brl(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function iniciais(n){
 if(!n) return 'U';
 const p=n.trim().split(/\s+/);
 return ((p[0]?.[0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase();
}
function corDeId(id){
 return (typeof window.ffCorDeId === 'function') ? window.ffCorDeId(id) : '#2563eb';
}
function estrelas(n){
 const c=Math.round(n);
 return '★'.repeat(c)+'☆'.repeat(5-c);
}
function dataBr(d){
 if(!d) return '—';
 return new Date(d).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
}
// Usa o helper global do api.js (com fallback caso ele não tenha carregado)
function avatarConteudo(u){
 return (typeof window.ffAvatarConteudo === 'function')
   ? window.ffAvatarConteudo(u)
   : esc(iniciais([u.nome, u.sobrenome].filter(Boolean).join(' ')));
}

let ehMeuPerfil = false;
let perfilAtual = null;

async function carregarPerfil() {
 const box = document.getElementById('conteudoPerfil');
 const eu  = (typeof Auth !== 'undefined' && Auth.logado()) ? Auth.usuario() : null;

 // Sem ?id= na URL: mostra o próprio perfil (é o link "Meu perfil" do menu)
 let id = new URLSearchParams(location.search).get('id');
 if (!id && eu) id = eu.id;

 if (!id) {
  box.innerHTML = '<div class="pf-card"><div class="vazio">Faça login para ver seu perfil.</div></div>';
  return;
 }

 ehMeuPerfil = !!(eu && Number(eu.id) === Number(id));

 let u;
 try {
  u = await ApiUsuarios.publico(id);
 } catch (err) {
  box.innerHTML = `<div class="pf-card"><div class="vazio">${esc(err.message || 'Perfil não encontrado.')}</div></div>`;
  return;
 }
 perfilAtual = u;

 const nomeCompleto = [u.nome, u.sobrenome].filter(Boolean).join(' ');
 const ehFreela  = u.tipo_doc === 'cpf';
 const tag = u.perfil === 'admin'
   ? '<span class="pf-tag tag-admin">Administrador</span>'
   : (ehFreela
      ? '<span class="pf-tag tag-freela">Freelancer</span>'
      : '<span class="pf-tag tag-contrat">Contratante</span>');

 const rep = (u.nota_media && u.total_avaliacoes)
  ? `<div class="pf-rep">
       <span class="pf-estrelas">${estrelas(u.nota_media)}</span>
       <span class="pf-nota">${u.nota_media.toFixed(1)}</span>
       <span class="pf-qtd">· ${u.total_avaliacoes} ${u.total_avaliacoes===1?'avaliação':'avaliações'}</span>
     </div>`
  : `<div class="pf-semrep">Ainda não recebeu avaliações</div>`;

 const habs = (u.habilidades || '').split(',').map(h=>h.trim()).filter(Boolean);
 const habHtml = habs.length
  ? `<div class="pf-hab">${habs.map(h=>`<span>${esc(h)}</span>`).join('')}</div>` : '';

 const bioHtml = u.bio
  ? `<div class="pf-bio">${esc(u.bio)}</div>`
  : (ehMeuPerfil
     ? `<div class="pf-bio" style="color:#94a3b8;font-style:italic;">Você ainda não escreveu uma apresentação. Clique em "Editar perfil" para adicionar.</div>`
     : '');

 // Só o dono do perfil vê o botão e o formulário de edição
 const btnEditar = ehMeuPerfil
  ? `<button class="pf-btn-editar" onclick="abrirEdicao()" id="btnEditar">Editar perfil</button>` : '';

 // Avatar + botão de trocar foto — o dono do perfil clica na própria foto para trocar
 const avatarHtml = ehMeuPerfil ? `
  <div class="pf-avatar-col">
   <label class="pf-avatar-wrap pf-avatar-clicavel" for="pfFotoInput" title="Clique para alterar sua foto">
    <div class="pf-avatar" style="background:${corDeId(u.id)};">${avatarConteudo(u)}</div>
    <span class="pf-avatar-overlay" aria-hidden="true">📷</span>
    <input type="file" id="pfFotoInput" accept="image/png,image/jpeg,image/webp" style="display:none;">
   </label>
   ${u.foto_url ? `<button type="button" class="pf-remover-foto" onclick="removerFoto()" id="btnRemoverFoto">Remover foto</button>` : ''}
  </div>` : `
  <div class="pf-avatar-wrap">
   <div class="pf-avatar" style="background:${corDeId(u.id)};">${avatarConteudo(u)}</div>
  </div>`;

 const formEdicao = ehMeuPerfil ? `
  <div class="pf-edit" id="pfEdit" style="display:none;">
   <div class="pf-msg" id="pfMsg"></div>
   <div class="pf-campo">
    <label for="edNome">Nome</label>
    <input type="text" id="edNome" value="${esc(u.nome || '')}" maxlength="100">
   </div>
   <div class="pf-campo">
    <label for="edSobrenome">Sobrenome</label>
    <input type="text" id="edSobrenome" value="${esc(u.sobrenome || '')}" maxlength="100">
   </div>
   <div class="pf-campo">
    <label for="edBio">Apresentação</label>
    <textarea id="edBio" rows="4" maxlength="2000"
      placeholder="Conte o que você faz, sua experiência e como trabalha...">${esc(u.bio || '')}</textarea>
    <span class="hint">Aparece no seu perfil público. Até 2000 caracteres.</span>
   </div>
   <div class="pf-campo">
    <label for="edHabilidades">Habilidades</label>
    <input type="text" id="edHabilidades" value="${esc(u.habilidades || '')}" maxlength="300"
      placeholder="Ex: Design Gráfico, Figma, Illustrator">
    <span class="hint">Separe por vírgula. Aparecem como etiquetas no perfil.</span>
   </div>
   <div class="pf-edit-btns">
    <button class="pf-cancelar" onclick="fecharEdicao()">Cancelar</button>
    <button class="pf-salvar" onclick="salvarPerfil()" id="btnSalvar">Salvar alterações</button>
   </div>
  </div>` : '';

 // Estatísticas conforme o papel
 const stats = ehFreela
  ? `<div class="pf-stat"><div class="pf-stat-num">${u.trabalhos_concluidos||0}</div><div class="pf-stat-lbl">Trabalhos concluídos</div></div>
     <div class="pf-stat"><div class="pf-stat-num">${u.propostas_enviadas||0}</div><div class="pf-stat-lbl">Propostas enviadas</div></div>
     <div class="pf-stat destaque"><div class="pf-stat-num">${brl(u.total_recebido)}</div><div class="pf-stat-lbl">Recebido na plataforma</div></div>`
  : `<div class="pf-stat"><div class="pf-stat-num">${u.projetos_publicados||0}</div><div class="pf-stat-lbl">Projetos publicados</div></div>
     <div class="pf-stat"><div class="pf-stat-num">${u.contratacoes_concluidas||0}</div><div class="pf-stat-lbl">Contratações concluídas</div></div>
     <div class="pf-stat destaque"><div class="pf-stat-num">${brl(u.total_investido)}</div><div class="pf-stat-lbl">Investido em projetos</div></div>`;

 // Avaliações recebidas
 const avals = u.avaliacoes || [];
 const avalHtml = avals.length
  ? avals.map(a => `
     <div class="aval-item">
      <div class="aval-topo">
       <div>
        <div class="aval-autor">${esc(a.avaliador_nome)} <span class="aval-est">${estrelas(a.nota)}</span></div>
        <div class="aval-proj">${esc(a.projeto_titulo)}</div>
       </div>
       <span class="aval-data">${new Date(a.criado_em).toLocaleDateString('pt-BR')}</span>
      </div>
      ${a.comentario ? `<div class="aval-coment">"${esc(a.comentario)}"</div>` : ''}
     </div>`).join('')
  : '<div class="vazio">Nenhuma avaliação ainda. As avaliações aparecem após a conclusão de um projeto.</div>';

 box.innerHTML = `
  <div class="pf-card">
   <div class="pf-topo">
    ${avatarHtml}
    <div class="pf-ident">
     <h2 class="pf-nome${u.tipo_doc === 'cnpj' ? ' ff-empresa' : ''}">${esc(nomeCompleto)}</h2>
     <div class="pf-tags">${tag}</div>
     <div class="pf-desde">Na FreelaFree desde ${dataBr(u.criado_em)}</div>
     ${rep}
    </div>
    ${btnEditar}
   </div>
   ${bioHtml}
   ${habHtml}
   ${formEdicao}
  </div>

  <div class="pf-card">
   <div class="pf-secao-titulo">Histórico na plataforma</div>
   <div class="pf-stats">${stats}</div>
  </div>

  <div class="pf-card">
   <div class="pf-secao-titulo">Avaliações recebidas ${u.total_avaliacoes ? `(${u.total_avaliacoes})` : ''}</div>
   ${avalHtml}
  </div>`;

 document.title = `${nomeCompleto} — FreelaFree`;
}

// ── Edição do próprio perfil ────────────────────────────────
function abrirEdicao() {
 document.getElementById('pfEdit').style.display = 'block';
 document.getElementById('btnEditar').style.display = 'none';
 document.getElementById('edNome')?.focus();
}
function fecharEdicao() {
 document.getElementById('pfEdit').style.display = 'none';
 const b = document.getElementById('btnEditar');
 if (b) b.style.display = 'inline-block';
 const m = document.getElementById('pfMsg');
 if (m) m.className = 'pf-msg';
}
async function salvarPerfil() {
 const msg = document.getElementById('pfMsg');
 const btn = document.getElementById('btnSalvar');
 const nome = document.getElementById('edNome').value.trim();

 if (!nome) {
  msg.className = 'pf-msg erro';
  msg.textContent = 'O nome não pode ficar vazio.';
  return;
 }

 btn.disabled = true;
 btn.textContent = 'Salvando...';
 try {
  const resp = await ApiUsuarios.atualizar({
   nome,
   sobrenome:   document.getElementById('edSobrenome').value.trim(),
   bio:         document.getElementById('edBio').value.trim(),
   habilidades: document.getElementById('edHabilidades').value.trim()
  });

  // Mantém o nome do menu em sincronia com o que foi salvo
  if (resp?.usuario) {
   const atual = Auth.usuario() || {};
   Auth.salvar(Auth.token(), { ...atual, nome: resp.usuario.nome, sobrenome: resp.usuario.sobrenome });
  }

  msg.className = 'pf-msg ok';
  msg.textContent = 'Perfil atualizado!';
  setTimeout(() => location.reload(), 700);
 } catch (err) {
  msg.className = 'pf-msg erro';
  msg.textContent = err.message || 'Não foi possível salvar.';
  btn.disabled = false;
  btn.textContent = 'Salvar alterações';
 }
}

// ── Upload da foto de perfil ─────────────────────────────────
// Delegação de evento: o input é recriado a cada render de carregarPerfil()
document.addEventListener('change', async (e) => {
 if (e.target.id !== 'pfFotoInput') return;
 const file = e.target.files[0];
 if (!file) return;

 if (file.size > 3 * 1024 * 1024) {
  ffToast('Imagem muito grande (máx. 3MB).', 'erro');
  e.target.value = '';
  return;
 }

 try {
  const resp = await ApiUsuarios.enviarFoto(file);

  // Atualiza o usuário logado no localStorage (para refletir em todas as páginas)
  const atual = Auth.usuario() || {};
  Auth.salvar(Auth.token(), { ...atual, foto_url: resp.foto_url });

  // Atualiza o objeto do perfil sendo exibido e repinta o avatar na hora
  if (perfilAtual) perfilAtual.foto_url = resp.foto_url;
  const avatarEl = document.querySelector('.pf-avatar');
  if (avatarEl) avatarEl.innerHTML = avatarConteudo(perfilAtual || Auth.usuario());

  // Atualiza a pill/dropdown do menu nesta mesma página
  if (typeof atualizarNavUsuario === 'function') atualizarNavUsuario();

  ffToast('Foto atualizada!', 'ok');
 } catch (err) {
  ffToast(err.message || 'Erro ao enviar foto.', 'erro');
 } finally {
  e.target.value = '';
 }
});

// ── Remoção da foto de perfil ─────────────────────────────────
async function removerFoto() {
 const ok = await ffConfirm('Tem certeza que deseja remover sua foto de perfil?', 'Remover foto');
 if (!ok) return;

 const btn = document.getElementById('btnRemoverFoto');
 if (btn) { btn.disabled = true; btn.textContent = 'Removendo...'; }

 try {
  await ApiUsuarios.removerFoto();

  // Atualiza o usuário logado no localStorage (reflete em todas as páginas)
  const atual = Auth.usuario() || {};
  Auth.salvar(Auth.token(), { ...atual, foto_url: null });

  // Atualiza o perfil exibido e repinta o avatar + remove o próprio botão
  if (perfilAtual) perfilAtual.foto_url = null;
  const avatarEl = document.querySelector('.pf-avatar');
  if (avatarEl) avatarEl.innerHTML = avatarConteudo(perfilAtual || Auth.usuario());
  if (btn) btn.remove();

  if (typeof atualizarNavUsuario === 'function') atualizarNavUsuario();

  ffToast('Foto removida!', 'ok');
 } catch (err) {
  ffToast(err.message || 'Erro ao remover foto.', 'erro');
  if (btn) { btn.disabled = false; btn.textContent = 'Remover foto'; }
 }
}

document.addEventListener('DOMContentLoaded', carregarPerfil);
</script>
<script src="transitions.js"></script>
</body>
</html>
